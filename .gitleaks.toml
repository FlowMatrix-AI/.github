# Shared org-wide gitleaks config. The reusable workflow
# (.github/workflows/gitleaks.yml) always fetches this file to
# `.gitleaks.org.toml`, and uses it directly when a repo has no config of its
# own.
#
# A repo that needs a local exception should INHERIT this file rather than copy
# it, so that additions here — including new [[rules]] — keep reaching it:
#
#   [extend]
#   path = ".gitleaks.org.toml"
#
#   [allowlist]
#   regexTarget = "line"
#   regexes = ['''<only this repo's exception>''']
#
# Do not set `useDefault` next to `path`: gitleaks refuses the combination
# ("unable to load config due to extend.path and extend.useDefault being set")
# and exits 1. The `useDefault = true` below chains through to the extending
# config, so the built-in rules stay active. Verified on 8.16.0 and 8.21.2.
#
# IMPORTANT: gitleaks honors the SINGULAR [allowlist] table — the plural
# [[allowlists]] form is silently ignored here (verified on gitleaks 8.21.2).
#
# Extends gitleaks' built-in rules and allowlists known-safe patterns. Keep
# entries NARROW. All regexes below use regexTarget="line".

[extend]
useDefault = true

[allowlist]
description = "Fixtures, example env files, truncated placeholders, UUID-valued config, and well-known published sample tokens"
regexTarget = "line"
paths = [
  '''(^|/)(test|tests|__tests__|fixtures|mocks|__mocks__)/''',
  '''(^|/)\.env\.example$''',
]
regexes = [
  # Truncated placeholder values, e.g. `SUPABASE_SERVICE_ROLE_KEY=eyJ...` or
  # `AWS_KEY=AKIA...` — a secret-looking line ending in an ellipsis is a doc
  # example, never a live secret.
  '''\.\.\.\s*$''',
  # UUID assigned as a value (after = or :), e.g. Wiki.js `oidc_strategy_key`,
  # which Wiki.js 2.x generates as a non-secret UUID identifier (confirmed in
  # platform-infra/platform-docs). Narrow: the UUID must be the assigned value,
  # not merely mentioned on the line.
  #
  # This entry used to be justified with "Real credentials are not bare UUIDs".
  # That premise is false for at least one provider class this org handles:
  # a GoHighLevel Private Integration Token is a UUID with a `pit-` prefix. The
  # prefix is what saves it here — it sits between the delimiter and the hex, so
  # this regex does not match and the rule below still fires. A credential
  # written as a BARE uuid would still be suppressed. This line is scoped by
  # shape, not by any guarantee about what a UUID can mean.
  '''[=:]\s*["'`]?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}''',
  # The jwt.io sample token's signature. Its payload is the textbook
  # {"sub":"1234567890","name":"John Doe","iat":1516239022}, signed with the
  # published secret "your-256-bit-secret" — a public constant, not a
  # credential. Vendored OpenAPI documents carry it as an example value
  # (Vikunja's link-share token, today), and every connector repo vendors an
  # upstream spec, so this recurs org-wide rather than in one repo.
  # Matched by the exact signature, so no other JWT is exempted: a real token
  # signed with a real secret has a different signature and still fires.
  '''SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c''',
]

# --- Rules -----------------------------------------------------------------
#
# Gitleaks' default set has no detector for GoHighLevel Private Integration
# Tokens. Four sat committed in FlowMatrix-AI/rutted-buck-landing from June
# 2026 through a weekly full-history sweep that reported success on every run,
# until a manual audit found them (.github#25, eng-governance#88).
#
# A PIT is a full API credential carrying whatever scopes it was issued with
# (contacts.write, opportunities.write, …) against a specific GHL sub-account.

[[rules]]
id = "gohighlevel-pit"
description = "GoHighLevel Private Integration Token"
# The `pit-` prefix makes this effectively false-positive-free, so it needs no
# entropy threshold and no path scoping. `keywords` keeps the scan cheap: the
# regex is only evaluated against lines containing this literal.
# No trailing \b, deliberately: it makes the rule MISS a malformed token whose
# final group runs to 13 hex chars, and for a scanner a miss is the costly
# direction. Measured both ways before choosing.
regex = '''\bpit-[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'''
keywords = ["pit-"]
entropy = 0

  # No rule-scoped allowlist, deliberately. The obvious entries -- `pit-<uuid>`
  # and `pit-xxxxxxxx-...` -- were written, then measured: neither can ever
  # match, because `<`, `>` and `x` are not hex digits, so the regex already
  # excludes every safe way of naming the shape. They were dead entries that
  # looked like coverage.
  #
  # A doc example written with real hex digits is, by construction,
  # indistinguishable from a live token -- so it SHOULD fail the scan. Write
  # `pit-<uuid>` in prose instead of allowlisting a hex-shaped example.

# Gitleaks' default set also has no detector for GoHighLevel inbound webhook
# capability URLs, a different credential class from a PIT and a live exposure
# of the same kind: a client site served two of them in its production HTML,
# and the weekly full-history sweep reported success on every run because
# nothing in the ruleset described the shape.
#
# A capability URL IS a credential: possession is authorisation. The receiving
# end verifies no signature and checks no origin or sender identity, so anyone
# holding the URL can post to the workflow it fires — injecting leads,
# triggering whatever SMS/email sends and automations that workflow drives
# against that sub-account. It carries no `secret`/`token`/`key` in its name
# and reads as an ordinary endpoint, which is exactly how it reaches
# client-side HTML.

[[rules]]
id = "gohighlevel-webhook-url"
description = "GoHighLevel inbound webhook capability URL"
# `keywords` keeps the scan cheap the same way as the rule above: the regex is
# only evaluated against lines containing this literal, and `webhook-trigger`
# is specific to this vendor's URL shape.
#
# Measured choices:
# * The host is matched at the registrable domain rather than pinned to the
#   `services.` subdomain, so a capability URL served from another
#   `*.leadconnectorhq.com` host still fires. For a scanner a miss is the
#   costly direction.
# * The location id is `[A-Za-z0-9]{15,30}`, not the exactly-20 characters both
#   measured URLs carried, so a longer agency- or company-scoped id still
#   fires. It still cannot match a documentation placeholder: `<` and `>` are
#   outside the class, so `/hooks/<locationId>/webhook-trigger/<uuid>` does not
#   match — measured, not assumed.
# * No trailing `\b`, deliberately, for the same reason as the rule above.
regex = '''(?i)\bleadconnectorhq\.com/hooks/[A-Za-z0-9]{15,30}/webhook-trigger/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'''
keywords = ["webhook-trigger"]
entropy = 0

  # The shared [allowlist] above was checked against this rule rather than
  # assumed harmless, and the two entries that could have masked it behave
  # differently:
  #
  # * The UUID-as-a-value entry does NOT mask it. That regex requires the hex
  #   to sit immediately after `=` or `:` (with an optional quote); here the
  #   UUID is the final path segment of a URL, preceded by `/`, so it never
  #   matches — confirmed against both real-world shapes.
  # * The truncated-placeholder entry (`\.\.\.\s*$`) DOES mask a finding when a
  #   full capability URL sits on a line that happens to end in an ellipsis,
  #   because `regexTarget = "line"` allowlists the whole line. Left as is: the
  #   entry is doing what it exists for, and narrowing it would cost more
  #   coverage elsewhere than it buys here. Write `/webhook-trigger/<uuid>` in
  #   prose instead of relying on a trailing ellipsis.
  #
  # No rule-scoped allowlist, for the reason given above: every safe way of
  # writing the shape (`<locationId>`, `<uuid>`, `xxxx`) is already outside the
  # regex, so an entry for one would be dead code that looked like coverage.
