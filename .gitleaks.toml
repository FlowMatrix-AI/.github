# Shared org-wide gitleaks config. Consumed by the reusable workflow
# (.github/workflows/gitleaks.yml) when a repo has no local .gitleaks.toml.
# A repo may commit its own .gitleaks.toml to override/extend this.
#
# IMPORTANT: gitleaks honors the SINGULAR [allowlist] table — the plural
# [[allowlists]] form is silently ignored here (verified on gitleaks 8.21.2).
#
# Extends gitleaks' built-in rules and allowlists known-safe patterns. Keep
# entries NARROW; the truncated-placeholder rule below is generic and safe
# because real secrets are never written ending in "...".

[extend]
useDefault = true

[allowlist]
description = "Fixtures, example env files, and truncated placeholders"
# regexTarget = "line" makes `regexes` match the whole source line (not just the
# captured secret) — needed for the truncated-placeholder rule.
regexTarget = "line"
paths = [
  '''(^|/)(test|tests|__tests__|fixtures|mocks|__mocks__)/''',
  '''(^|/)\.env\.example$''',
]
regexes = [
  # Truncated placeholder values, e.g. `SUPABASE_SERVICE_ROLE_KEY=eyJ...` or
  # `AWS_KEY=AKIA...` — any secret-looking line ending in an ellipsis is a doc
  # example, never a live secret.
  '''\.\.\.\s*$''',
]

# NOTE: Wiki.js OIDC UUIDs (platform-docs / platform-infra) were confirmed
# non-secret in the sweep. If they surface as findings, add a targeted path or
# commit allowlist here during tuning rather than a broad UUID regex (which
# would mask real findings).
