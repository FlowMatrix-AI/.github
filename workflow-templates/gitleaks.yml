name: secret-scan

# Calls the org's reusable gitleaks workflow, which runs the gitleaks BINARY
# (MIT-licensed, free). Do NOT use gitleaks/gitleaks-action@v2 — it requires a
# paid GITLEAKS_LICENSE for organization repos.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly full-history sweep, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    # Pinned by hand and frozen: renovate.json disables updates to this repo's
    # self-reference. A local "./" ref cannot be used here -- the Actions template
    # picker copies this file verbatim into OTHER repos. An adopting repo's own
    # Renovate pins this forward on its first run.
    uses: FlowMatrix-AI/.github/.github/workflows/gitleaks.yml@5eb6dcf14c9f9def31d9883fd217ab0a20841cab # main
