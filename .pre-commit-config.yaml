# Shared pre-commit config — copy into a repo root and run `pre-commit install`
# to block secrets before they are ever committed.
# Docs: https://pre-commit.com
#
# Keep this in step with the gitleaks-version default in
# .github/workflows/gitleaks.yml, so the local gate and CI run the same
# detection rules. Renovate manages this file (`:enablePreCommit` in
# renovate.json) -- without that the pre-commit manager is off by default and
# this rev rots silently, which is how it sat on v8.21.2 alongside the
# workflow. See #30.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
