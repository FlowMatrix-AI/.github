name: gitleaks

# Reusable secret-scanning workflow for the org. Runs the gitleaks BINARY
# (MIT-licensed, free) — NOT gitleaks/gitleaks-action, which requires a paid
# GITLEAKS_LICENSE for organization repos.
#
# Consume from any repo with a caller workflow:
#   jobs:
#     gitleaks:
#       uses: FlowMatrix-AI/.github/.github/workflows/gitleaks.yml@main

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: gitleaks release version (no leading v)
        type: string
        # The line below is a tracked dependency. Renovate reads this comment
        # via the customManagers entry in this repo's renovate.json; without it
        # the version is a bare string in a curl URL that no manager can see,
        # which is how it sat on 8.21.2 (Oct 2024) for a year. `extractVersion`
        # strips the leading `v` from the release tag, because the curl URL
        # below adds its own. Keep the comment directly above `default:` —
        # the manager matches the pair.
        # renovate: datasource=github-releases depName=gitleaks/gitleaks extractVersion=^v(?<version>.+)$
        default: "8.30.1"

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # full history so scheduled runs scan every commit

      - name: Install gitleaks (binary)
        run: |
          v="${{ inputs.gitleaks-version }}"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # The org config is ALWAYS fetched, to a fixed filename, so a repo-local
      # .gitleaks.toml can inherit it rather than fork it:
      #
      #   [extend]
      #   path = ".gitleaks.org.toml"
      #
      #   [allowlist]
      #   regexes = ['''<only this repo's exception>''']
      #
      # Do NOT also set `useDefault` alongside `path` — gitleaks rejects the
      # combination outright ("unable to load config due to extend.path and
      # extend.useDefault being set"). `useDefault = true` in the org config
      # chains through, so the built-in rules stay active either way.
      #
      # A repo with no config of its own still gets the org one, as before.
      #
      # The ruleset is fetched AT THE REF THIS WORKFLOW WAS CALLED AT, not from
      # `main`. That is the whole point of the step, so do not "simplify" it
      # back to a branch:
      #
      # A caller pins `gitleaks.yml@<digest>`. That digest already freezes the
      # detector — `gitleaks-version` is an input default in THIS file — but
      # while the config was fetched from `main` it did not freeze the rules the
      # detector ran with. So the pin was half a pin, and the uncovered half
      # failed OPEN: broadening the shared [allowlist] shrank detection in every
      # calling repo on its next scan, with no commit, no PR and no review
      # anywhere else, and every required check stayed green. A weakening of
      # detection has to be visible somewhere, and the only place a consumer can
      # see it is a change to a ref it controls.
      #
      # `job.workflow_sha` is the commit SHA of the file that defines the
      # current job — this reusable workflow, at the caller's ref. For a caller
      # on `@main` or a branch it resolves to that branch's current head, so an
      # unpinned caller behaves exactly as before; only a pinned caller changes,
      # and it changes to what its pin already claimed.
      #
      # The cost, stated plainly: a fix to the shared ruleset no longer reaches
      # a pinned repo until that repo's pin moves (Renovate's digest PR). A
      # repo sitting on a stale pin now visibly scans with a stale ruleset
      # instead of a stale binary running current rules.
      - name: Fetch the org ruleset at this workflow's ref
        env:
          CONFIG_SHA: ${{ job.workflow_sha }}
          CONFIG_REF: ${{ job.workflow_ref }}
        run: |
          set -euo pipefail
          # Fail closed on an empty SHA rather than falling back to a branch:
          # an unknown ruleset version is the one thing this step must not scan
          # with.
          : "${CONFIG_SHA:?job.workflow_sha was empty; refusing to resolve the org ruleset}"
          if [ -f .gitleaks.toml ]; then local_config=yes; else local_config=no; fi
          # -f: fail on an HTTP error instead of writing the error body into the
          # config file. Unguarded, so a fetch failure fails the job rather than
          # silently scanning with a different (or empty) ruleset.
          curl -fsSL "https://raw.githubusercontent.com/FlowMatrix-AI/.github/${CONFIG_SHA}/.gitleaks.toml" \
            -o .gitleaks.org.toml
          if [ "$local_config" = no ]; then
            cp .gitleaks.org.toml .gitleaks.toml
          fi
          # Record which ruleset this run actually scanned with, so a change in
          # detection behaviour is legible from the run itself and not only from
          # a diff in another repository.
          {
            echo "### gitleaks ruleset"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| workflow ref | \`${CONFIG_REF}\` |"
            echo "| org ruleset commit | \`${CONFIG_SHA}\` |"
            echo "| org ruleset sha256 | \`$(sha256sum .gitleaks.org.toml | cut -d' ' -f1)\` |"
            echo "| repo-local \`.gitleaks.toml\` | ${local_config} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan
        run: |
          cfg=""
          [ -f .gitleaks.toml ] && cfg="--config .gitleaks.toml"
          # --redact: never print secret values to the (persisted) Actions log
          gitleaks git --redact -v $cfg
