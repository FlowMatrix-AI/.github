name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly full-history sweep, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    # Same repo: use a local ref so there is no digest to pin. A self-pin here
    # made Renovate bump this repo to its own new HEAD every week, which reset
    # renovate/stability-days on every downstream digest PR in the org.
    uses: ./.github/workflows/gitleaks.yml
